<svg xmlns="http://www.w3.org/2000/svg" viewBox="100 88 1000 504" role="img" aria-labelledby="title desc">
  <title id="title">HUB Unclik</title>
  <desc id="desc">Ilustração simplificada da plataforma, com menu lateral, resumo financeiro e calendário.</desc>
<!-- Fundo na paleta Unclik, com uma única janela em destaque. -->
<rect width="1200" height="680" rx="28" fill="#d294ef" opacity=".24"/>
  <rect x="100" y="88" width="1000" height="504" rx="22" fill="#fff"/>
  <path d="M122 88h154v504H122a22 22 0 0 1-22-22V110a22 22 0 0 1 22-22Z" fill="#300149"/>

  <g font-family="Manrope,Arial,sans-serif">
    <!-- Navegação reduzida aos elementos essenciais. -->
    <text x="126" y="142" fill="#fff" font-size="22" font-weight="700">HUB Unclik</text>
    <rect x="116" y="182" width="144" height="42" rx="10" fill="#8312bf"/>
    <svg class="tabler-icon icon-tabler-home" aria-hidden="true" focusable="false" x="130" y="195" style="color:#fff" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" > <path d="M5 12l-2 0l9 -9l9 9l-2 0" /> <path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2 -2v-7" /> <path d="M9 21v-6a2 2 0 0 1 2 -2h2a2 2 0 0 1 2 2v6" /> </svg>
    <svg class="tabler-icon icon-tabler-building-bank" aria-hidden="true" focusable="false" x="129" y="250" style="color:#d294ef" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" > <path d="M3 21l18 0" /> <path d="M3 10l18 0" /> <path d="M5 6l7 -3l7 3" /> <path d="M4 10l0 11" /> <path d="M20 10l0 11" /> <path d="M8 14l0 3" /> <path d="M12 14l0 3" /> <path d="M16 14l0 3" /> </svg>
    <svg class="tabler-icon icon-tabler-arrows-exchange" aria-hidden="true" focusable="false" x="129" y="310" style="color:#d294ef" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" > <path d="M7 10h14l-4 -4" /> <path d="M17 14h-14l4 4" /> </svg>
    <svg class="tabler-icon icon-tabler-folder" aria-hidden="true" focusable="false" x="129" y="366" style="color:#d294ef" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" > <path d="M5 4h4l3 3h7a2 2 0 0 1 2 2v8a2 2 0 0 1 -2 2h-14a2 2 0 0 1 -2 -2v-11a2 2 0 0 1 2 -2" /> </svg>
    <svg class="tabler-icon icon-tabler-bell" aria-hidden="true" focusable="false" x="129" y="424" style="color:#d294ef" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" > <path d="M10 5a2 2 0 1 1 4 0a7 7 0 0 1 4 6v3a4 4 0 0 0 2 3h-16a4 4 0 0 0 2 -3v-3a7 7 0 0 1 4 -6" /> <path d="M9 17v1a3 3 0 0 0 6 0v-1" /> </svg>
    <g font-size="14">
      <text x="160" y="209" fill="#fff" font-weight="600">Home</text>
      <text x="160" y="270" fill="#e9d9f1">Contas</text>
      <text x="160" y="326" fill="#e9d9f1">Conciliações</text>
      <text x="160" y="382" fill="#e9d9f1">Arquivos</text>
      <text x="160" y="439" fill="#e9d9f1">Notificações</text>
    </g>
    <path d="M126 515h124" stroke="#623378"/>
    <circle cx="137" cy="548" r="11" fill="#d294ef"/>
    <text x="160" y="553" fill="#e9d9f1" font-size="14">Área do cliente</text>

    <!-- Cabeçalho discreto, sem controles decorativos duplicados. -->
    <text x="316" y="149" fill="#300149" font-size="26" font-weight="600">Bem-vindo ao HUB</text>
    <text x="316" y="177" fill="#6b6273" font-size="14">Visão geral</text>
    <circle cx="1048" cy="149" r="18" fill="#f4edf8"/>
    <svg class="tabler-icon icon-tabler-user" aria-hidden="true" focusable="false" x="1037" y="138" style="color:#8312bf" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" > <path d="M8 7a4 4 0 1 0 8 0a4 4 0 0 0 -8 0" /> <path d="M6 21v-2a4 4 0 0 1 4 -4h4a4 4 0 0 1 4 4v2" /> </svg>

    <!-- Resumos abstratos, sem valores financeiros de exemplo. -->
    <g fill="#f4edf8">
      <rect x="316" y="212" width="228" height="82" rx="12"/>
      <rect x="562" y="212" width="228" height="82" rx="12"/>
      <rect x="808" y="212" width="252" height="82" rx="12"/>
    </g>
    <g fill="#601284" font-size="14">
      <text x="338" y="242">Total entrada</text>
      <text x="584" y="242">Total saída</text>
      <text x="830" y="242">Saldo</text>
    </g>
    <g fill="#8312bf">
      <rect x="338" y="259" width="72" height="8" rx="4"/>
      <rect x="584" y="259" width="52" height="8" rx="4" opacity=".55"/>
      <rect x="830" y="259" width="62" height="8" rx="4" opacity=".75"/>
    </g>

    <!-- Um gráfico simples e um calendário esquemático. -->
    <rect x="316" y="316" width="474" height="234" rx="14" fill="#fff" stroke="#e7dced"/>
    <text x="340" y="352" fill="#300149" font-size="17" font-weight="600">Financeiro</text>
    <path d="M340 402h424M340 452h424M340 502h424" stroke="#f0e7f5"/>
    <path d="M342 480c54 0 58-39 104-39s59 18 104 3 66-50 111-44 66-10 101-27" fill="none" stroke="#8312bf" stroke-width="3" stroke-linecap="round"/>
    <circle cx="762" cy="373" r="5" fill="#8312bf" stroke="#fff" stroke-width="3"/>

    <rect x="808" y="316" width="252" height="234" rx="14" fill="#fff" stroke="#e7dced"/>
    <text x="832" y="352" fill="#300149" font-size="17" font-weight="600">Calendário</text>
    <g fill="#6b6273" font-size="14" text-anchor="middle">
      <text x="840" y="390">D</text><text x="871" y="390">S</text><text x="902" y="390">T</text>
      <text x="933" y="390">Q</text><text x="964" y="390">Q</text><text x="995" y="390">S</text><text x="1026" y="390">S</text>
    </g>
    <g fill="#f4edf8">
      <rect x="830" y="408" width="20" height="20" rx="6"/><rect x="861" y="408" width="20" height="20" rx="6"/>
      <rect x="892" y="408" width="20" height="20" rx="6"/><rect x="923" y="408" width="20" height="20" rx="6"/>
      <rect x="954" y="408" width="20" height="20" rx="6"/><rect x="985" y="408" width="20" height="20" rx="6"/>
      <rect x="1016" y="408" width="20" height="20" rx="6"/>
      <rect x="830" y="442" width="20" height="20" rx="6"/><rect x="861" y="442" width="20" height="20" rx="6"/>
      <rect x="892" y="442" width="20" height="20" rx="6"/><rect x="923" y="442" width="20" height="20" rx="6"/>
      <rect x="954" y="442" width="20" height="20" rx="6"/><rect x="985" y="442" width="20" height="20" rx="6"/>
      <rect x="1016" y="442" width="20" height="20" rx="6"/>
      <rect x="830" y="476" width="20" height="20" rx="6"/><rect x="861" y="476" width="20" height="20" rx="6"/>
      <rect x="892" y="476" width="20" height="20" rx="6"/><rect x="923" y="476" width="20" height="20" rx="6"/>
      <rect x="954" y="476" width="20" height="20" rx="6"/><rect x="985" y="476" width="20" height="20" rx="6"/>
      <rect x="1016" y="476" width="20" height="20" rx="6"/>
    </g>
    <rect x="954" y="442" width="20" height="20" rx="6" fill="#8312bf"/>
  </g>
</svg>
