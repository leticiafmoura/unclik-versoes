<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Unclik — Versões da home</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 32px 20px; background: #f3ecfa; color: #281039; font-family: Poppins, sans-serif; }
    main { width: min(100%, 760px); }
    img { width: 150px; height: auto; margin-bottom: 32px; }
    h1 { margin: 0 0 12px; font-size: clamp(28px, 5vw, 44px); line-height: 1.2; }
    p { margin: 0 0 32px; color: #65576f; }
    nav { display: grid; gap: 14px; }
    a { padding: 24px; display: flex; justify-content: space-between; gap: 20px; border: 1px solid #decce9; border-radius: 20px; background: #fff; color: #5b1484; font-size: 20px; font-weight: 600; text-decoration: none; }
    a:hover { border-color: #8312bf; }
    a:focus-visible { outline: 3px solid #147d52; outline-offset: 4px; }
    a:last-child { background: #147d52; border-color: #147d52; color: #fff; }
  </style>
  <link rel="stylesheet" href="versao-6/shared-assets/fonts/fonts.css">
</head>
<body>
  <main>
    <img src="versao-6/shared-assets/unclik-logo-roxo-oficial.png" alt="Unclik">
    <h1>Versões da home</h1>
    <p>Selecione a versão que deseja visualizar.</p>
    <nav aria-label="Versões disponíveis">
      <a href="versao-3/">Versão 3 <span aria-hidden="true">↗</span></a>
      <a href="versao-6/">Versão 6 <span aria-hidden="true">↗</span></a>
      <a href="alteracoes/">Alterações <span aria-hidden="true">↗</span></a>
    </nav>
  </main>
</body>
</html>
